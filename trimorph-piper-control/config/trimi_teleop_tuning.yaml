# Tuning for scripts/teleop/trimi_teleop.py, read on every run.
#
#   built-in defaults  <  this file (or --tuning FILE)  <  command-line flags
#
# Keys are the long option names. Skip this file with --no-tuning; write the
# settings a command line amounts to with --save-tuning FILE. Angles are motor
# radians (0.04 rad = 2.3 deg): on the geared PIP/MCP the finger joint turns 0.4x
# as far (0.04 rad = 0.9 deg at the joint); thumb and ABAD are 1:1.

# Follower tracking
current_limit_ma: 400           # follower's force cap (above contact_current_ma when that is used)
max_speed_rad_s: 10.0
max_acceleration_rad_s2: 80.0
follower_p_gain: null           # null: the follower calibration's (now 2000 / 100 / 400)
follower_i_gain: null
follower_d_gain: null
rate_hz: 100
ramp_s: 2.0
max_jump_rad: 1.0

# Contact: both of these for contact_hold_ms
contact_error_rad: 0.02         # leader past the follower by more than this
contact_still_rad_s: 0.25       # follower slower than this (held back); a slow follower still tracking moves 0.2-0.6
contact_hold_ms: 20
contact_current_ma: null        # null: positions only; a number also requires the follower to push that hard
stop_margin_rad: 0.1            # no feedback this close to the joint's homing stop

# Wall
wall_current_ma: 1500            # the wall's holding current on the leader (XL330 limit 1750)
wall_follow: false              # false: the wall stays where contact began; true: it moves with the follower
wall_settle_ms: 300             # after contact the wall holds this long, so the leader is brought back to it
wall_release_rad: 0.01          # let go once the leader is this far out of the wall (the hand opens)
wall_release_ma: 40             # let go once the wall's motor pulls the finger in this hard
wall_pass_rad: 0.03             # let go once the follower moves on this far past the wall (nothing there)
wall_speed_rad_s: 6.0           # how fast the leader is brought back to a wall it went past
wall_p_gain: null               # wall stiffness; null: the leader calibration's (now 2000 / 100 / 400)
wall_i_gain: null
wall_d_gain: null

# Joints (uncomment to use)
# feedback_motors: [0, 1, 4, 5, 6, 7, 8, 9, 10, 11, 12]
# grasp_only: {}                # {} = index/middle/ring PIP and MCP; e.g. {1: -1} adds thumb joint 1

# Hardware on this machine (uncomment to drop --leader-port/--follower-port)
# leader_port: /dev/serial/by-id/usb-FTDI_USB__-__Serial_Converter_FTBEO9P0-if00-port0
# follower_port: /dev/serial/by-id/usb-FTDI_USB__-__Serial_Converter_FTBEO3G5-if00-port0
