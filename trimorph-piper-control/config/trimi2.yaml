# Trimi2: the second TriMi hand, on USB adapter FTBEO3G5 (Trimi1 is FTBEO9P0).
# 2026-11-22: IDs 1, 6, 9 and 12 changed from XL330-M077-T to XC330-M181-T.
#
# Not homed: home_offsets are all 0, so positions are raw motor angles times
# joint_signs. Record -> replay uses the same config both ways, so tracking
# error and current are unaffected; only absolute angles are uncalibrated.
# Joint limits are opened (+/-100 rad) for the RSS record/replay test.
#
# midas_hand_api takes one motor_model for the whole hand. XL330 and XC330
# share the control table and units, so xl330-m077-t works for this mix. The
# real model on each ID is in motor_models; the rss_preparation scripts check
# it on connect, which catches running the wrong hand's config. Update it
# whenever a motor is swapped (and re-record: a new motor has a new zero).
